<text x="338" y="324" fill="#38bdf8" font-family="JetBrains Mono, monospace" font-size="12">01. understand_question -&gt; 02. create_research_plan (4 focused subquestions)</text>
<text x="338" y="350" fill="#38bdf8" font-family="JetBrains Mono, monospace" font-size="12">03. generate_search_queries -&gt; 04. search_web (Tavily two-stage discovery)</text>
<text x="338" y="376" fill="#10b981" font-family="JetBrains Mono, monospace" font-size="12">05. deduplicate_sources -&gt; 06. rank_sources (domain diversity cap enforced)</text>
<text x="338" y="402" fill="#10b981" font-family="JetBrains Mono, monospace" font-size="12">07. extract_source_content (Trafilatura + BS4; SSRF private-IP guard active)</text>
<text x="338" y="428" fill="#cbd5e1" font-family="JetBrains Mono, monospace" font-size="12">08. extract_evidence -&gt; 09. evaluate_evidence (provenance &amp; limitation tags)</text>
<text x="338" y="454" fill="#f59e0b" font-family="JetBrains Mono, monospace" font-size="12">10. cross_check_claims -&gt; 11. identify_research_gaps (3 disagreements typed)</text>
<text x="338" y="480" fill="#10b981" font-family="JetBrains Mono, monospace" font-size="12">12. generate_report -&gt; 13. validate_citations (0 ungrounded [n] links) -&gt; 14. save</text>
