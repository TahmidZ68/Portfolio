<text x="338" y="324" fill="#38bdf8" font-family="JetBrains Mono, monospace" font-size="12">$ diagora scan ./monorepo --severity high --format sarif &gt; report.sarif</text>
<text x="338" y="350" fill="#cbd5e1" font-family="JetBrains Mono, monospace" font-size="12">› [DISCOVER] Monorepo detected: ecosystems=[python, node, docker]</text>
<text x="338" y="376" fill="#10b981" font-family="JetBrains Mono, monospace" font-size="12">› [SECURITY] Path &amp; symlink containment verified (0 escapes, 0 &gt;5MiB)</text>
<text x="338" y="402" fill="#10b981" font-family="JetBrains Mono, monospace" font-size="12">› [PYTHON]   PY001-PY010 checked pyproject.toml, uv.lock, setup.py (AST)</text>
<text x="338" y="428" fill="#10b981" font-family="JetBrains Mono, monospace" font-size="12">› [NODE]     ND001-ND009 checked package.json, tsconfig.json (JSONC)</text>
<text x="338" y="454" fill="#f59e0b" font-family="JetBrains Mono, monospace" font-size="12">› [DEPLOY]   DP001-DP003 checked .github/workflows/*.yml, vercel.json</text>
<text x="338" y="480" fill="#10b981" font-family="JetBrains Mono, monospace" font-size="12">› [SARIF]    Emitted SARIF 2.1.0 (runs[0].tool.driver.name='Diagora')</text>
