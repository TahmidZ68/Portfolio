<text x="324" y="612" fill="#f8fafc" font-family="Inter, sans-serif" font-size="14" font-weight="700" letter-spacing="0.5">SECURITY MODEL &amp; HONEST EXECUTION GUARANTEES</text>
<rect x="324" y="628" width="1052" height="68" rx="8" fill="#0a0f18" stroke="#1e293b" stroke-width="1"/>
<text x="344" y="654" fill="#10b981" font-family="JetBrains Mono, monospace" font-size="12" font-weight="600">SEC-BOUNDARY · Path Containment &amp; Resource Limits</text>
<text x="344" y="677" fill="#f8fafc" font-family="Inter, sans-serif" font-size="14" font-weight="600">Blocks ../ directory traversal and symlink escapes; caps recursion depth (15) and files (10,000)</text>
<text x="730" y="654" fill="#94a3b8" font-family="JetBrains Mono, monospace" font-size="11.5">Never executes repository code or package install hooks during static analysis</text>
<text x="730" y="677" fill="#10b981" font-family="Inter, sans-serif" font-size="12.5" font-weight="500">PASS · Untrusted-Input Safe</text>
<rect x="1240" y="646" width="116" height="32" rx="6" fill="#10b981" fill-opacity="0.18" stroke="#10b981" stroke-width="1"/>
<text x="1298" y="666" text-anchor="middle" fill="#f8fafc" font-family="JetBrains Mono, monospace" font-size="10.5" font-weight="600">PASS</text>
<rect x="324" y="706" width="1052" height="68" rx="8" fill="#0a0f18" stroke="#1e293b" stroke-width="1"/>
<text x="344" y="732" fill="#10b981" font-family="JetBrains Mono, monospace" font-size="12" font-weight="600">HONEST-STATUS · Explicit Analyzer Applicability Tracking</text>
<text x="344" y="755" fill="#f8fafc" font-family="Inter, sans-serif" font-size="14" font-weight="600">Distinguishes 'completed' from 'no_applicable_analyzers' so unsupported languages never read clean</text>
<text x="730" y="732" fill="#94a3b8" font-family="JetBrains Mono, monospace" font-size="11.5">Prevents false-positive green CI checks on Rust/Go-only repositories</text>
<text x="730" y="755" fill="#10b981" font-family="Inter, sans-serif" font-size="12.5" font-weight="500">VERIFIED · Zero False Clean</text>
<rect x="1240" y="724" width="116" height="32" rx="6" fill="#10b981" fill-opacity="0.18" stroke="#10b981" stroke-width="1"/>
<text x="1298" y="744" text-anchor="middle" fill="#f8fafc" font-family="JetBrains Mono, monospace" font-size="10.5" font-weight="600">VERIFIED</text>
<rect x="324" y="784" width="1052" height="68" rx="8" fill="#0a0f18" stroke="#1e293b" stroke-width="1"/>
<text x="344" y="810" fill="#10b981" font-family="JetBrains Mono, monospace" font-size="12" font-weight="600">EXIT-GATE · Policy-Driven CI Enforcement (--severity high)</text>
<text x="344" y="833" fill="#f8fafc" font-family="Inter, sans-serif" font-size="14" font-weight="600">Returns exit code 0 when clean, 1 on threshold breach, 2 on invalid args, 3 on security violation</text>
<text x="730" y="810" fill="#94a3b8" font-family="JetBrains Mono, monospace" font-size="11.5">Ready for drop-in GitHub Actions &amp; SARIF security tab uploads</text>
<text x="730" y="833" fill="#10b981" font-family="Inter, sans-serif" font-size="12.5" font-weight="500">COMPLETED · CI Ready</text>
